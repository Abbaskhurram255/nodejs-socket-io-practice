<!DOCTYPE html>
<html>

<head>
    <title>Node.js Chat</title>
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>
</head>

<body>
    <div class="container">
        <ul id="messages"></ul>
        <form id="form" action="">
            <input id="usernameInput" autocomplete="off" placeholder="Enter your name" /><br>
            <input id="m" placeholder="Type your message" /><button class="btn primary" type="submit">Send</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('m');
        const usernameInput = document.getElementById('usernameInput');
        const messages = document.getElementById('messages');

        let username = '';
        const randUserNames = ["Michael", "Perry", "Jessie", "Amanda", "Jessica", "Daniel", "David", "Emily", "Sarah", "Andrew", "Samantha", "Christopher", "Hannah", "Joshua", "Elizabeth", "Ashley", "Nicholas", "Megan", "Joseph", "Lauren", "Tyler", "Kayla", "Brandon", "Rachel", "Ethan", "Victoria", "Samuel", "Jennifer", "Anthony", "Natalie", "Dylan", "Olivia", "Alexander", "Grace", "Ryan", "Chloe", "Zachary", "Brianna", "Justin", "Anna", "Kevin", "Sofia", "Thomas", "Alyssa", "Jordan", "Madison", "Kyle", "Lily", "Brian", "Sydney", "Eric", "Hailey", "Steven", "Kaitlyn", "Katherine", "Alexis", "Kate", "Isabella", "Jason", "Kylee", "Jacob", "Bianca", "Caleb", "Brenice", "Abigail", "Vermon", "Tina", "Sandy", "Roger", "Nancy", "Monica", "Liam", "Logan", "Noah", "Evelyn", "Scarlett", "Levi", "Madelyn", "Jaxon", "Carter", "Luke", "Owen", "Gabriel", "Aiden", "Lucas", "Mia", "Ella", "Aria", "Zoe", "Nora", "Riley", "Hazel", "Chloe", "Luna", "Addison", "Eleanor", "Stella", "Natalia", "Violet", "Audrey", "Skylar", "Paisley", "Claire", "Brooklyn", "Bella", "Savannah", "Lucy", "Anna", "Caroline", "Genesis", "Aaliyah", "Kennedy", "Kinsley", "Allison", "Maya", "Sarah", "Madeline", "Cora", "Ruby", "Eva", "Serenity", "Autumn", "Adeline", "Hayley", "Gianna", "Valentina", "Isabelle", "Elena", "Piper", "Lydia", "Aubrey", "Josephine", "Nevaeh", "Ivy", "Clara", "Vivian", "Reagan", "Madilyn", "Peyton", "Julia", "Rylee", "Melanie", "Raelynn", "Melody", "Athena", "Mariah", "Liliana", "Hadley", "Jade", "Emery", "Adalynn", "Ximena", "Alina", "Cecilia", "Margaret", "Delilah", "Nicole", "Ariana", "Kimberly", "Juliana", "Valeria", "Maryam", "Lilah", "Esther", "Harmony", "Rosemary", "Sinclair", "Kyle"];
        let randUserName = randUserNames[Math.floor(Math.random() * randUserNames.length)];
        usernameInput.value = randUserName;
        username = usernameInput.value.trim();
        socket.emit('set name', username);

        // Prompt for username
        let oldUsername = username;
        usernameInput.addEventListener('change', () => {
            username = usernameInput.value.trim();
            if (username) {
                socket.emit('set name', username);
                const newItem = document.createElement('li');
                newItem.textContent = `${oldUsername} is now called ${username}.`;
                messages.appendChild(newItem);
                oldUsername = username;
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value && username) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            item.textContent = `${data.username}: ${data.message}`;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        });

        socket.on('user joined', (name) => {
            if (username == randUserName)
                return;
            const item = document.createElement('li');
            item.textContent = `${name} has joined the chat.`;
            messages.appendChild(item);
        });

        socket.on('user left', (name) => {
            if (oldUsername != username) {
                return;
            }
            const item = document.createElement('li');
            item.textContent = `${name} has left the chat.`;
            messages.appendChild(item);
        });
    </script>
</body>

</html>
